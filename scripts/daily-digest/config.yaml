# デイリーダイジェストの設定
# 対象は実行時点から collect.windowHours 時間以内に投稿されたものだけ（記事の日付は実行日）。
# 人間の判断（ブロック・重みづけ・推し）は curation.yaml に書く。

article:
  minItems: 5 # これ未満しか採用できなければ記事を作らない
  maxItems: 30
  maxItemsPerCategory: 4 # 同じカテゴリはカルーセルにまとめるので、数件まで載せる
  # カテゴリごとに上限を変える場合（label: 件数）
  maxItemsByCategory:
    音楽・MV: 12
  # 記事内でのカテゴリの表示順。genres の label をすべて並べる（抜けていると実行時にエラー）
  categoryOrder:
    - 音楽・MV
    - 最新AI技術
    - 最新クリエイティブツール
    - 表現の解説
    - 最新ゲーム
    - やる気が出る・元気になる
    - セール
    - イラスト
    - 風景写真
  # 見出しから閉じられないカテゴリ（再生中に閉じて音が止まらないように）
  fixedCategories:
    - 音楽・MV
  category: デイリーダイジェスト
  # 手書きの記事と見分けるため、生成記事に必ず付けるタグ
  tags: [自動生成]
  dir: src/content/posts/daily-digest

collect:
  windowHours: 24 # 実行時点から何時間さかのぼって集めるか

review:
  candidatesPerGenre: 10 # ジャンルごとに候補一覧に出す上位件数（pin した候補は別枠で必ず出る）

# pnpm digest select --llm で API の LLM に選ばせるときだけ使う
llm:
  # 上から順に試し、失敗（残高不足・障害・拒否など）したら次へフォールバックする。
  # APIキー（ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY）が未設定のものは飛ばす。
  providers:
    - provider: anthropic
      model: claude-opus-5
    - provider: openai
      model: gpt-6-sol
    - provider: gemini
      model: gemini-3.8-flash

x:
  # X API は読み取り件数あたりの費用のわりに候補が残らないので、2026-09-26 に使うのをやめた。
  # false の間は source: x / x-youtube のジャンルを収集しない（設定は再開したときのために残す）
  enabled: false
  # 従量課金なので、1回の実行で読み取る投稿数の上限を決めておく
  maxPostsPerRun: 600
  maxResultsPerQuery: 50 # 10〜100
  minAgeHours: 1 # 投稿から1時間未満は伸び率が振れるので除外
  minLikes: 30
  # 全クエリ共通で付与する条件
  baseQuery: "lang:ja -is:retweet -is:reply"
  # sampleRetweets のジャンルでリツイートを検索するときに付ける条件（is:retweet は自動で付く）
  retweetBaseQuery: "lang:ja"

youtube:
  regionCode: JP
  relevanceLanguage: ja
  maxResults: 50 # search.list は件数にかかわらず1回100ユニットなので、上限まで取る
  minViews: 1000
  # タイトルかチャンネル名に仮名（ひらがな・カタカナ）がある動画だけ残す。ジャンルごとに上書きできる
  requireKana: true
  excludeShorts: true # ショート動画を除く（/shorts/<ID> が開けるかで判定する）
  maxDurationMinutes: 15 # これより長い動画（歌枠・雑談などの配信アーカイブ）を除く
  # 音楽・MV に載せないタイトル（アニメの PV・予告・CM など）。ジャンルごとに excludeTitle で上書きできる
  excludeTitle: "PV|Trailer|トレーラー|ティザー|予告|告知|CM|番宣|本編|切り抜き|生成してみた|AIカバー|AI歌唱|ランキング|TOP ?\\d+|ベスト\\d+|まとめ|メドレー|予想"
  # AI で作った曲を載せないよう、チャンネル名・概要欄で除く（大文字小文字は区別する）
  excludeChannel: "\\bAI\\b|ＡＩ|Suno|Udio|生成AI|AI(作曲|音楽|ソング|Music|Song|Studio)"
  excludeDescription: "Suno|Udio|AIで作(曲|成|った)|AI作曲|AI生成|生成AIで|AIを使って作|AI ?Music|Made with AI"
  # 何時間前までに公開された動画を検索するか（音楽は24時間では再生数が集まらないので長めに）
  windowHours: 72

steam:
  enabled: true
  minDiscountPercent: 50
  maxItems: 10

# genres に step を書くと、同じカテゴリのカルーセルの中を step ごとに区切って表示する（上部に区切りの切り替えが出る）。
# step の表示順は genres に最初に出てくる順で、step の中はスコア順。
# 並び順 = X の読み取り上限が足りないときの優先順（記事内の表示順は article.categoryOrder）。
# 上限は X ジャンル（source: x / x-youtube）で xWeight（既定1）の比で分けるが、1ジャンルあたり10件未満になると後ろから順にスキップされる。
# （YouTube・SoundCloud・Steam は上限を消費しないので位置は関係ない。sale は Steam で補えるので X の中では最後）
genres:
  # X で共有された YouTube 動画を「共有したアカウント数」で並べる。再生数の多い海外コンテンツより、
  # 界隈で話題の曲が上がりやすい。読み取りが多く要るので xWeight で上限の配分を多めにしている
  - id: x-music
    label: 音楽・MV
    step: Xで話題
    source: x-youtube
    # カバー曲（歌ってみた・歌枠）は載せないので、検索の段階で除いて読み取りを節約する。
    # 「MV制作」「映像担当」などは、MV を作ったクリエイターが自分の仕事として紹介する投稿を拾うため
    query: '(url:youtube.com OR url:youtu.be) (MV OR 新曲 OR ボカロ OR 初音ミク OR アニソン OR 主題歌 OR ノンクレジット OR オリジナル曲 OR "MV制作" OR "映像担当" OR "映像制作") -歌ってみた -歌枠 -cover -カバー'
    # 共有者2人以上に届く動画が少なく、読み取り100件あたりの候補が2件ほどだったので配分を減らした
    xWeight: 1
    maxReads: 100
    minSharers: 2 # 1人しか貼っていない動画は宣伝の可能性が高いので除く
    minFollowers: 500 # フォロワーが少ないアカウントの共有は数えない（宣伝用・捨てアカウント対策）
    maxVideoAgeDays: 7 # 共有は当日でも、動画の公開がこれより古いものは除く

  # 自分で作った X リストのメンバーが貼った YouTube 動画。好みの調整は X アプリでリストを編集するだけでよい。
  # リストは公開にしておく（非公開リストはアプリのトークンでは読めない）。listId は URL の x.com/i/lists/<ID>
  - id: x-list-music
    label: 音楽・MV
    step: Xで話題
    source: x-youtube
    listId: ""
    maxReads: 200
    minSharers: 1
    maxVideoAgeDays: 7

  # ai・illust・landscape はキーワードに当たる投稿が多すぎて、関連度順に50件読んでもいいね数の条件に
  # ほとんど届かなかった。sampleRetweets でリツイートを読み、よくリツイートされている投稿（人気の投稿）を拾う。
  #   sampleSlices:    対象期間をいくつの区間に分けて読むか（既定6。読み取りが足りなければ減らす）
  #   maxPostAgeHours: リツイート元の投稿を何時間前まで許すか（既定72）
  #   mediaTypes:      リツイート元の添付メディアの種類（photo / video / animated_gif）を絞る
  #   excludeVerifiedTypes: 除く認証の種類。business（企業・団体）を除くと、公式アカウントの告知が減る
  # exclude は本文・投稿者名に対する正規表現で、当たる投稿は除く
  - id: ai
    label: 最新AI技術
    source: x
    sampleRetweets: true
    xWeight: 2 # リツイートの標本が多いほど人気の投稿が重なって見えるので、読み取りを多めに配分する
    maxReads: 100
    # AIで生成したイラストの作品投稿は載せないので、検索の段階で除く
    # 「生成AI」で検索すると是非をめぐる論争ばかり拾うので、ツール名とリリース・新モデルの話題に寄せる
    query: '(ChatGPT OR Claude OR Gemini OR LLM OR "AIモデル" OR "画像生成AI" OR "動画生成AI") (リリース OR 新モデル OR 新機能 OR 公開 OR 発表 OR アップデート) -AIイラスト -AIart -nijijourney -AIグラビア -キャンペーン -プレゼント'
    # 生成AIの是非をめぐる言い争いと、副業・情報商材の宣伝も除く
    exclude: "AIイラスト|AIart|aiart|nijijourney|NovelAI|AIグラビア|#NSFW|キャンペーン|プレゼント|抽選|盗難|窃盗|犯罪|搾取|信者|規制|消滅|手描き|反AI|無検閲|月\\d+万|稼げ|副業|note販売"

  - id: creative-tools
    label: 最新クリエイティブツール
    source: x
    # 騒動・規約変更などの話題に巻き込まれないよう、リリース・新機能の告知に寄せる
    query: '(Blender OR Photoshop OR "CLIP STUDIO" OR クリスタ OR Figma OR "After Effects" OR "DaVinci Resolve" OR Procreate OR Live2D OR Unity OR "Unreal Engine" OR Krita OR ZBrush) (新機能 OR アップデート OR リリース OR 正式リリース OR 正式版 OR ベータ版 OR 新バージョン OR 搭載 OR 配信開始) -騒動 -炎上 -規約 -改悪 -AIイラスト'

  - id: games
    label: 最新ゲーム
    source: x
    # ゲームのニュースはリツイートで広まるので、人気の投稿を拾う（関連度順では50件読んで候補2件だった）
    sampleRetweets: true
    maxReads: 80
    # 決済会社・団体をめぐる政治的な話題と、ゲーム以外の番組の告知を除く
    exclude: "フェミ|団体|圧力|クレカ|カード会社|規制|番組|放送"
    query: '(新作ゲーム OR 発売日 OR 配信開始 OR 新作発表 OR "Nintendo Direct" OR Steam) (ゲーム OR Switch OR PS5 OR Steam)'

  - id: illust
    label: イラスト
    step: X
    source: x
    sampleRetweets: true
    xWeight: 2 # リツイートの標本が多いほど人気の投稿が重なって見えるので、読み取りを多めに配分する
    maxReads: 100
    mediaTypes: [photo, animated_gif] # 画像の投稿だけ（動画は MV・PV が多いので除く）
    # アニメ・ゲーム・くじなどの公式アカウントの告知が多く上がるので、個人の作品に寄せる
    excludeVerifiedTypes: [business, government]
    query: "(イラスト OR 絵描きさんと繋がりたい OR 落書き OR オリジナルイラスト OR 創作) -AIイラスト -AIart -nijijourney -キャンペーン -抽選 -プレゼント -グッズ -募集"
    # AI 絵のアカウントは名前に AI を入れていることが多いので、投稿者名も見る
    exclude: "AIイラスト|AIart|aiart|nijijourney|NovelAI|StableDiffusion|#NSFW|_AI\\b|AI$|キャンペーン|抽選|プレゼント|POP ?UP|グッズ|募集|予約|くじ|発売|開催|放送|ご視聴|waifu|Official|公式|お誕生日"
    minLikes: 500

  - id: landscape
    label: 風景写真
    source: x
    sampleRetweets: true
    xWeight: 2 # リツイートの標本が多いほど人気の投稿が重なって見えるので、読み取りを多めに配分する
    maxReads: 100
    mediaTypes: [photo] # 写真だけ
    # テレビ番組・写真集・アイドルなどの告知が「絶景」「夕焼け」に当たるので、公式アカウントは除く
    excludeVerifiedTypes: [business, government]
    query: "(風景写真 OR 写真好きな人と繋がりたい OR ファインダー越しの私の世界 OR 絶景 OR 夕焼け OR 星景写真) -AIイラスト -AIart -AI写真 -AI生成 -キャンペーン -抽選 -プレゼント"
    # 「絶景」「夕焼け」はイラスト・舞台の告知・人物の撮影会にも当たるので、それらを除く
    # （写真のハッシュタグだけに絞ると、候補がほとんど残らなかった）
    exclude: "AIイラスト|AIart|AI写真|AI生成|キャンペーン|抽選|プレゼント|イラスト|Illustration|舞台|公演|撮影会|ポートレート|コスプレ|写真集|先行カット|放送|出演|企画|Official|公式|お誕生日"
    minLikes: 300

  - id: expression
    label: 表現の解説
    source: x
    query: '(演出 OR 構図 OR 色彩 OR 表現 OR 作画) (解説 OR 考察 OR ポイント OR 技法)'

  - id: motivation
    label: やる気が出る・元気になる
    source: x
    query: "(モチベーション OR やる気 OR 元気が出る OR 前向き OR 習慣化)"

  - id: sale
    label: セール
    source: x
    query: "(セール OR 無料配布 OR 期間限定無料 OR 割引) (ゲーム OR ソフト OR ツール OR 素材 OR Steam)"

  - id: sale-steam
    label: セール
    source: steam

  # YouTube の検索は再生数順なので、1つの検索にまとめると大型アーティストが上位を占める。
  # 検索を分けて候補を確保する。search.list は1回100ユニット（1日1万ユニットまで）
  - id: anison
    label: 音楽・MV
    step: アニソン
    source: youtube
    # アニメ公式チャンネルは「音楽」以外のカテゴリで上げることが多いのでカテゴリは絞らない。
    # PV・予告は excludeTitle で除く。q の | の間に空白を入れると検索が崩れる（ほとんど当たらなくなる）
    q: "ノンクレジット|アニメ主題歌|アニソン|オープニング映像|エンディング映像|OPテーマ|EDテーマ|TVアニメ"

  - id: vocaloid
    label: 音楽・MV
    step: ボカロ・歌ってみた
    source: youtube
    videoCategoryId: "10"
    q: "ボカロ|ボーカロイド|VOCALOID|初音ミク|重音テト|可不|オリジナル曲"

  - id: mv
    label: 音楽・MV
    step: MV・新曲
    source: youtube
    videoCategoryId: "10"
    q: "MV|ミュージックビデオ|Music Video"

  # 音楽の候補を増やすための検索（アーティスト公式の新曲・インディー・ボカロ P のオリジナル曲）
  - id: new-song
    label: 音楽・MV
    step: MV・新曲
    source: youtube
    videoCategoryId: "10"
    # 英語の語（Official Video など）を入れると海外の MV ばかりになるので日本語の語だけにする
    q: "新曲|オリジナル曲|ミュージックビデオ|リリックビデオ|公式MV|書き下ろし"

  - id: vocaloid-original
    label: 音楽・MV
    step: ボカロ・歌ってみた
    source: youtube
    q: "初音ミク|重音テト|可不|鏡音リン|GUMI|知声|小春六花|ボカロP|VOCALOID"

  - id: music
    label: 音楽・MV
    step: MV・新曲
    source: youtube
    videoCategoryId: "10"
    q: ""

  # SoundCloud の検索から直接集める（API キー・従量課金なし）。ランキングの API がないので、
  # タグとキーワードで直近の曲を検索し、いいね・リポスト・再生の伸び率で並べる。
  # 日本の曲は24時間では再生が集まらないので、公開から maxTrackAgeDays 日以内を対象にする
  - id: soundcloud
    label: 音楽・MV
    step: SoundCloud
    source: soundcloud
    tags: [vocaloid, j-pop, anime, j-core]
    queries: [初音ミク, 重音テト, 可不]
    pages: 2 # 1回の検索で読むページ数（1ページ50曲）
    maxTrackAgeDays: 7
    minLikes: 3
    # AI で作った曲は載せない
    exclude: "Suno|Udio|\\bAI\\b|ＡＩ|AI作曲|AI生成|生成AI|AIで作|#?ai ?music|#?aimusic"

  # ---- X API の代わり（2026-09-26〜）----
  # はてなブックマークの人気エントリー（カテゴリ別 RSS）。include に当たる記事をブックマーク数の伸び率で並べる。
  # categories: it（テクノロジー）/ game（アニメとゲーム）/ knowledge（学び）/ entertainment など
  - id: hatena-ai
    label: 最新AI技術
    source: hatena
    categories: [it]
    # 大文字小文字は区別する。AI は英単語の途中（EXPLAIN など）に当たらないよう \b で区切る
    include: "\\bAI\\b|ＡＩ|\\bLLM|生成AI|ChatGPT|Claude|Gemini|OpenAI|Anthropic|機械学習|AIエージェント|Copilot"
    # 生成AIの是非をめぐる言い争いは載せない
    exclude: "規制|反AI|盗用|窃盗|炎上|消滅|手描き|使わない"
    minBookmarks: 30

  # ツールの話題は人気エントリーに入りにくいので、ツール名のタグ検索と公式・専門サイトの RSS も読み、
  # 1週間以内の記事をブックマーク数で並べる
  - id: hatena-tools
    label: 最新クリエイティブツール
    source: hatena
    categories: [it, game, knowledge]
    tags: [Blender, Photoshop, Illustrator, CLIP STUDIO PAINT, クリスタ, Live2D, Figma, Unity, Unreal Engine, Godot, Krita, After Effects, DaVinci Resolve, 3DCG]
    feeds:
      - https://forest.watch.impress.co.jp/data/rss/1.0/wf/feed.rdf # 窓の杜（ソフトの更新情報）
      - https://www.blender.org/feed/
      - https://unity.com/ja/blog/rss
    maxAgeHours: 168
    include: "Blender|Photoshop|CLIP STUDIO|クリスタ|Figma|After Effects|Premiere|DaVinci|Procreate|Live2D|Unity|Unreal Engine|Krita|ZBrush|Illustrator|Adobe|Godot|Aseprite|3DCG|フォント|描き方|お絵描き"
    # 規約・決済をめぐる騒動は「ネットで話題のニュース」で扱う
    exclude: "炎上|騒動|規制|検閲|決済"
    minBookmarks: 5

  - id: hatena-games
    label: 最新ゲーム
    source: hatena
    categories: [game]
    include: "ゲーム|Switch|PS5|Xbox|Steam|任天堂|ニンテンドー|体験版|インディー|RPG"
    minBookmarks: 20

  # Bluesky の人気の投稿（イラスト）。AI 絵はタグ・投稿者名で除く
  - id: bluesky-illust
    label: イラスト
    step: Bluesky
    source: bluesky
    queries: ["#イラスト", "#絵描きさんと繋がりたい", "#一次創作", "#創作", "#落書き", "#illustration"]
    requireImages: true
    minLikes: 100
    exclude: "AIイラスト|AIart|aiart|AI生成|AIグラビア|StableDiffusion|NovelAI|nijijourney|使用モデル|#NSFW|R-?18|_AI\\b|AI$"

  # Misskey.io の人気ノートのうち、画像付きのもの（イラストの質が高い）。
  # 注意書き（CW）・センシティブ指定の画像があるノートは除く
  - id: misskey-illust
    label: イラスト
    step: Misskey
    source: misskey
    host: misskey.io
    requireImages: true
    minReactions: 50
    exclude: "🔞|R-?18|NSFW|ドスケベ|えっち|エロ|AIイラスト|AIart|AI生成"
