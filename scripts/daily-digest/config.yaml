# デイリーダイジェストの設定
# 対象は実行時点から collect.windowHours 時間以内に投稿されたものだけ（記事の日付は実行日）。
# 人間の判断（ブロック・重みづけ・推し）は curation.yaml に書く。

article:
  minItems: 5 # これ未満しか採用できなければ記事を作らない
  maxItems: 20
  maxItemsPerCategory: 4 # 同じカテゴリはカルーセルにまとめるので、数件まで載せる
  # カテゴリごとに上限を変える場合（label: 件数）
  maxItemsByCategory:
    音楽・MV: 8
  # 記事内でのカテゴリの表示順。genres の label をすべて並べる（抜けていると実行時にエラー）
  categoryOrder:
    - 音楽・MV
    - 最新AI技術
    - 最新クリエイティブツール
    - ツールの使い方・使いこなし術
    - 表現の解説
    - 最新ゲーム
    - やる気が出る・元気になる
    - セール
    - 伸びているイラスト
    - 風景写真
  category: デイリーダイジェスト
  # 手書きの記事と見分けるため、生成記事に必ず付けるタグ
  tags: [自動生成]
  dir: src/content/posts/daily-digest

collect:
  windowHours: 24 # 実行時点から何時間さかのぼって集めるか

review:
  candidatesPerGenre: 6 # ジャンルごとに候補一覧に出す上位件数（pin した候補は別枠で必ず出る）

# pnpm digest select --llm で API の LLM に選ばせるときだけ使う
llm:
  # 上から順に試し、失敗（残高不足・障害・拒否など）したら次へフォールバックする。
  # APIキー（ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY）が未設定のものは飛ばす。
  providers:
    - provider: anthropic
      model: claude-opus-5
    - provider: openai
      model: gpt-6-sol
    - provider: gemini
      model: gemini-3.8-flash

x:
  # 従量課金なので、1回の実行で読み取る投稿数の上限を決めておく
  maxPostsPerRun: 600
  maxResultsPerQuery: 50 # 10〜100
  minAgeHours: 1 # 投稿から1時間未満は伸び率が振れるので除外
  minLikes: 30
  # 全クエリ共通で付与する条件
  baseQuery: "lang:ja -is:retweet -is:reply"

youtube:
  regionCode: JP
  relevanceLanguage: ja
  maxResults: 25
  minViews: 1000
  # タイトルかチャンネル名に仮名（ひらがな・カタカナ）がある動画だけ残す。ジャンルごとに上書きできる
  requireKana: true

steam:
  enabled: true
  minDiscountPercent: 50
  maxItems: 10

# genres に step を書くと、同じカテゴリのカルーセルの中を step ごとに区切って表示する（上部に区切りの切り替えが出る）。
# step の表示順は genres に最初に出てくる順で、step の中はスコア順。
# 並び順 = X の読み取り上限が足りないときの優先順（記事内の表示順は article.categoryOrder）。
# 上限は X ジャンル（source: x / x-youtube / x-soundcloud）で xWeight（既定1）の比で分けるが、1ジャンルあたり10件未満になると後ろから順にスキップされる。
# （YouTube・Steam は上限を消費しないので位置は関係ない。sale は Steam で補えるので X の中では最後）
genres:
  # X で共有された YouTube 動画を「共有したアカウント数」で並べる。再生数の多い海外コンテンツより、
  # 界隈で話題の曲が上がりやすい。読み取りが多く要るので xWeight で上限の配分を多めにしている
  - id: x-music
    label: 音楽・MV
    step: Xで話題
    source: x-youtube
    query: '(url:youtube.com OR url:youtu.be) (MV OR 新曲 OR 歌ってみた OR ボカロ OR 初音ミク OR アニソン OR 主題歌 OR ノンクレジット OR オリジナル曲 OR 歌枠)'
    xWeight: 3
    maxReads: 200
    minSharers: 2 # 1人しか貼っていない動画は宣伝の可能性が高いので除く
    maxVideoAgeDays: 7 # 共有は当日でも、動画の公開がこれより古いものは除く

  # 自分で作った X リストのメンバーが貼った YouTube 動画。好みの調整は X アプリでリストを編集するだけでよい。
  # リストは公開にしておく（非公開リストはアプリのトークンでは読めない）。listId は URL の x.com/i/lists/<ID>
  - id: x-list-music
    label: 音楽・MV
    step: Xで話題
    source: x-youtube
    listId: ""
    maxReads: 200
    minSharers: 1
    maxVideoAgeDays: 7

  # X で共有された SoundCloud の曲。曲の情報は曲ページの埋め込みデータから読む（API キー不要）。
  # SoundCloud はローマ字名の日本人クリエイターが多いので、仮名フィルタ（requireKana）は既定で掛けない
  - id: x-soundcloud
    label: 音楽・MV
    step: SoundCloud
    source: x-soundcloud
    query: 'url:soundcloud.com (新曲 OR ボカロ OR 初音ミク OR 重音テト OR 可不 OR remix OR リミックス OR オリジナル曲 OR 歌ってみた OR フリーダウンロード OR "Free DL")'
    maxReads: 100
    minSharers: 2 # 1人だけだと、作者が自分の曲を貼った宣伝ばかりになる
    maxTrackAgeDays: 7 # 共有は当日でも、曲の公開がこれより古いものは除く

  - id: ai
    label: 最新AI技術
    source: x
    # AIで生成したイラストの作品投稿は載せないので、検索の段階で除く
    query: '(生成AI OR LLM OR ChatGPT OR Claude OR Gemini OR "AIモデル" OR "画像生成AI" OR "動画生成AI") -AIイラスト -AIart -nijijourney -AIグラビア'

  - id: creative-tools
    label: 最新クリエイティブツール
    source: x
    query: '(Blender OR Photoshop OR "CLIP STUDIO" OR クリスタ OR Figma OR "After Effects" OR "DaVinci Resolve" OR Procreate) (新機能 OR アップデート OR リリース OR 発表)'

  - id: tool-tips
    label: ツールの使い方・使いこなし術
    source: x
    query: '(Blender OR Photoshop OR "CLIP STUDIO" OR クリスタ OR Figma OR "After Effects" OR "DaVinci Resolve" OR Procreate) (Tips OR 小技 OR やり方 OR 使い方 OR 時短 OR ショートカット)'

  - id: games
    label: 最新ゲーム
    source: x
    query: '(新作ゲーム OR 発売日 OR 配信開始 OR 新作発表 OR "Nintendo Direct" OR Steam) (ゲーム OR Switch OR PS5 OR Steam)'

  - id: illust
    label: 伸びているイラスト
    source: x
    query: "(イラスト OR 絵描きさんと繋がりたい OR 落書き) has:images -is:quote -AIイラスト -AIart -nijijourney"
    minLikes: 500

  - id: landscape
    label: 風景写真
    source: x
    query: "(風景写真 OR 写真好きな人と繋がりたい OR ファインダー越しの私の世界 OR 絶景 OR 夕焼け) has:images -is:quote -AIイラスト -AIart -AI写真 -AI生成"
    minLikes: 300

  - id: expression
    label: 表現の解説
    source: x
    query: '(演出 OR 構図 OR 色彩 OR 表現 OR 作画) (解説 OR 考察 OR ポイント OR 技法)'

  - id: motivation
    label: やる気が出る・元気になる
    source: x
    query: "(モチベーション OR やる気 OR 元気が出る OR 前向き OR 習慣化)"

  - id: sale
    label: セール
    source: x
    query: "(セール OR 無料配布 OR 期間限定無料 OR 割引) (ゲーム OR ソフト OR ツール OR 素材 OR Steam)"

  - id: sale-steam
    label: セール
    source: steam

  # YouTube の検索は再生数順なので、1つの検索にまとめると大型アーティストが上位を占める。
  # 検索を分けて候補を確保する。search.list は1回100ユニット（1日1万ユニットまで）
  - id: anison
    label: 音楽・MV
    step: アニソン
    source: youtube
    # アニメ公式チャンネルは「音楽」以外のカテゴリで上げることが多いのでカテゴリは絞らない
    q: "ノンクレジット|アニメ主題歌|アニソン|TVアニメ|オープニング映像|エンディング映像"

  - id: vocaloid
    label: 音楽・MV
    step: ボカロ・歌ってみた
    source: youtube
    videoCategoryId: "10"
    q: "ボカロ|ボーカロイド|VOCALOID|初音ミク|重音テト|可不|歌ってみた"

  - id: vtuber
    label: 音楽・MV
    step: VTuber
    source: youtube
    videoCategoryId: "10"
    q: "VTuber|ホロライブ|hololive|にじさんじ|ぶいすぽ|オリジナル曲"

  - id: mv
    label: 音楽・MV
    step: MV・新曲
    source: youtube
    videoCategoryId: "10"
    q: "MV|ミュージックビデオ|Music Video"

  - id: music
    label: 音楽・MV
    step: MV・新曲
    source: youtube
    videoCategoryId: "10"
    q: ""
